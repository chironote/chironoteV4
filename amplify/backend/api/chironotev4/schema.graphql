type UserSubscription @model(timestamps: null) @auth(rules: [{ allow: owner }]) {
  owner: String! @primaryKey
  tier: String!
  hoursleft: Float!
  notesleft: Int
  hoursSaved: Float        # Total hours saved by user (for Account page display)
  hoursSavedLifetime: Float # Total hours saved by user across all time (cumulative)
  isActivated: Boolean     # Controls tutorial visibility and sign_up event tracking
  has3Notes: Boolean       # Tracks 3-note milestone completion (early adopter)
  has5Notes: Boolean       # Tracks 5-note milestone completion (power user)
}

type Notes @model(timestamps: null) @auth(rules: [{ allow: owner }]) {
  owner: String! @primaryKey(sortKeyFields: ["timestamp"])
  timestamp: String!
  recordingJobId: ID
  recordingStatus: String
  recordingErrorCode: String
  transcriptionProvider: String
  transcriptionRequestId: String
  transcriptionAttempt: Int
  transcript: String
  note: String
  isCompleted: Boolean
  noteLabel: String
}

type Subscription {
  onCreateNotesByOwner(owner: String!): Notes
    @aws_subscribe(mutations: ["createNotes"])
  
  onUpdateNotesByOwner(owner: String!): Notes
    @aws_subscribe(mutations: ["updateNotes"])
}

type RecordingTelemetryEvent
  @model(timestamps: null)
  @auth(rules: [
    { allow: private, provider: userPools, operations: [create] }
    { allow: private, provider: iam, operations: [create] }
    { allow: groups, groups: ["Support"], operations: [read] }
  ]) {
  id: ID! @primaryKey
  recordingJobId: ID!
    @index(
      name: "recordingTelemetryEventsByRecordingJobId"
      sortKeyFields: ["timelineKey"]
      queryField: "recordingTelemetryEventsByRecordingJobId"
    )
  timelineKey: String!
  occurredAt: AWSDateTime!
  producerOccurredAt: AWSDateTime
  expiresAt: AWSTimestamp!
  sequence: Int!
  schemaVersion: String!
  appBuild: String!
  source: String!
  platform: String!
  browser: String!
  eventName: String!
  attempt: Int
  awsRequestId: String
  s3RequestId: String
  sqsMessageId: String
  providerRequestId: String
  chunkBytes: Int
  chunkOrder: Int
  deliveryAttempt: Int
  droppedEventCount: Int
  durationMs: Int
  httpStatus: Int
  observedDurationMs: Int
  queueDepth: Int
  retryDelayMs: Int
  sampleCount: Int
  signalDurationMs: Int
  peak: Float
  rmsAverage: Float
  isFinalChunk: Boolean
  noSpeech: Boolean
  transcriptFallback: Boolean
  alertCode: String
  container: String
  errorCode: String
  notificationChannel: String
  outcome: String
  provider: String
  reasonCode: String
  stage: String
  transcriptMatchedBy: String
  deviceHash: String
  deviceType: String
  mimeType: String
  producerVersion: String
  requestedTrackSettings: AWSJSON
  appliedTrackSettings: AWSJSON
}
